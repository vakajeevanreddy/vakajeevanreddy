<polyline points="1100.0,0.0 1073.2,100.0 1000.0,173.2 900.0,200.0 800.0,173.2 726.8,100.0 700.0,0.0 726.8,-100.0 800.0,-173.2 900.0,-200.0 1000.0,-173.2 1073.2,-100.0 1100.0,0.0" fill="none" stroke="#C0C0C0" stroke-width="0.4" opacity="0.12"/>
